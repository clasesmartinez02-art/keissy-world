<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keissy Nicole | Santuario Digital</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Marcellus&family=Pinyon+Script&display=swap" rel="stylesheet">

<style>

:root{
--gold:#d4af37;
--dark:#050208;
--violet:#1a0b2e;
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:'Marcellus',serif;
color:var(--gold);
background:
radial-gradient(circle at 20% 30%, #1a0b2e 0%, transparent 40%),
radial-gradient(circle at 80% 70%, #0a0315 0%, transparent 40%),
#050208;
}

/* SIDEBAR */

aside{
width:260px;
height:100vh;
position:fixed;
background:linear-gradient(180deg,#1a0f0a,#000);
padding:30px 20px;
border-right:1px solid var(--gold);
}

.side-title{
font-family:'Cinzel';
text-align:center;
margin-bottom:30px;
}

nav a{
display:block;
color:var(--gold);
text-decoration:none;
padding:12px;
border:1px solid transparent;
margin-bottom:8px;
}

nav a:hover{
border:1px solid var(--gold);
background:rgba(212,175,55,0.1);
}

button{
margin-top:20px;
padding:12px;
width:100%;
background:linear-gradient(45deg,#d4af37,#7c652c);
border:none;
font-family:'Cinzel';
font-weight:bold;
cursor:pointer;
}

main{
margin-left:260px;
padding:40px;
}

header{
text-align:center;
margin-bottom:40px;
}

header h1{
font-family:'Cinzel';
font-size:2.8rem;
margin:0;
}

header p{
font-family:'Pinyon Script';
font-size:2rem;
color:#a582ff;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

.panel{
background:rgba(10,5,20,0.9);
border:1px solid var(--gold);
padding:25px;
position:relative;
}

.panel::before{
content:"";
position:absolute;
top:6px;
left:6px;
right:6px;
bottom:6px;
border:1px solid rgba(212,175,55,0.3);
pointer-events:none;
}

/* PERFIL */

.perfil{
display:flex;
gap:20px;
background:#e4d5b7;
color:black;
padding:20px;
}

.avatar{
width:120px;
height:120px;
border-radius:50%;
background:url('https://i.imgur.com/6VBx3io.png') center/cover;
border:3px solid black;
}

/* BIBLIOTECA */

.shelf{
display:flex;
align-items:flex-end;
gap:6px;
height:160px;
border-bottom:5px solid #3e2723;
}

.book{
width:35px;
writing-mode:vertical-rl;
font-size:.6rem;
color:white;
padding:5px;
}

.book:hover{
transform:translateY(-8px);
}

/* LAB */

.lab{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.lab-box{
border:1px solid var(--gold);
padding:15px;
display:flex;
gap:15px;
}

.circle{
width:50px;
height:50px;
border-radius:50%;
border:1px solid var(--gold);
display:flex;
align-items:center;
justify-content:center;
}

/* GALERIA */

#gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

img{
width:100%;
height:180px;
object-fit:cover;
border:1px solid var(--gold);
}

</style>

</head>

<body>

<aside>
<div class="side-title">
<h3>KEISSY NICOLE</h3>
</div>

<nav>
<a href="#">Inicio</a>
<a href="#">Biblioteca</a>
<a href="#">Laboratorio</a>
<a href="#">Colección</a>
</nav>

<button onclick="document.getElementById('file').click()">Añadir a la colección</button> <input type="file" id="file" hidden>

</aside>

<main>

<header>
<h1>El Mundo de Keissy Nicole</h1>
<p>Entre la psique y la fantasía</p>
</header>

<div class="grid">

<section class="panel perfil">
<div class="avatar"></div>
<div>
<h3>KEISSY NICOLE</h3>
<p>Nacimiento: 25 Agosto</p>
<p>Origen: San Juan</p>
<p>Pasiones: Vampiros</p>
</div>
</section>

<section class="panel">
<h3>Biblioteca Gótica</h3>
<div class="shelf">
<div class="book" style="background:#641e16;height:140px">Dracula</div>
<div class="book" style="background:#111;height:150px">Crimen</div>
<div class="book" style="background:#145a32;height:120px">Brujas</div>
<div class="book" style="background:#311b92;height:140px">Psi</div>
</div>
</section>

<section class="panel" style="grid-column:span 2">
<h3>Laboratorio Psicológico</h3>
<div class="lab">
<div class="lab-box">
<div class="circle">Ψ</div>
<div>Conducta</div>
</div>
<div class="lab-box">
<div class="circle">🧠</div>
<div>Análisis</div>
</div>
</div>
</section>

<section class="panel" style="grid-column:span 2">
<h3>Mi Colección</h3>
<div id="gallery"></div>
</section>

</div>

</main>

<script>

const file=document.getElementById('file')
const gallery=document.getElementById('gallery')

window.onload=()=>{
const saved=JSON.parse(localStorage.getItem('keissy')||'[]')
saved.forEach(add)
}

file.onchange=e=>{
const reader=new FileReader()
reader.onload=ev=>{
add(ev.target.result)
const saved=JSON.parse(localStorage.getItem('keissy')||'[]')
saved.push(ev.target.result)
localStorage.setItem('keissy',JSON.stringify(saved))
}
reader.readAsDataURL(e.target.files[0])
}

function add(src){
const img=document.createElement('img')
img.src=src
gallery.appendChild(img)
}

</script>

</body>
</html>
